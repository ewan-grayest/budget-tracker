# Every value below comes from the environment with a default, so the same file
# works unchanged across machines. Copy .env.example to .env to override.
services:
  budget-manager:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-0}
        DATA_DIR: ${DATA_DIR:-/data}
        APP_PORT: ${PORT:-8080}
    image: ${IMAGE_NAME:-budget-manager}:${IMAGE_TAG:-local}
    container_name: ${CONTAINER_NAME:-budget-manager}
    restart: ${RESTART_POLICY:-unless-stopped}
    # Start as root so the entrypoint can take ownership of a root-owned volume,
    # which is how most hosts attach one. It drops to RUN_UID:RUN_GID before the
    # application starts, and refuses to run it as root. Set
    # CONTAINER_USER=10001:0 when the platform manages the mount's ownership
    # itself; the cap_add block below then becomes unnecessary.
    user: ${CONTAINER_USER:-0:0}
    # Reaps orphans and forwards signals even if the entrypoint ever stops
    # handling SIGTERM itself.
    init: true
    ports:
      # Loopback by default: Basic Auth sends credentials in cleartext, so
      # anything beyond this host belongs behind a TLS-terminating proxy. Set
      # BIND_ADDRESS=0.0.0.0 once such a proxy is in place.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      DB_PATH: ${DB_PATH:-}
      DB_TIMEOUT: ${DB_TIMEOUT:-30}
      DATA_FILE_MODE: ${DATA_FILE_MODE:-0660}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      APP_NAME: ${APP_NAME:-}
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-1}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      CBR_URL: ${CBR_URL:-}
      CBR_TIMEOUT: ${CBR_TIMEOUT:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      FORWARDED_PROTO_HEADER: ${FORWARDED_PROTO_HEADER:-X-Forwarded-Proto}
      RUN_UID: ${APP_UID:-10001}
      RUN_GID: ${APP_GID:-0}
      UMASK: ${UMASK:-0002}
    volumes:
      - budget_data:${DATA_DIR:-/data}
    # The app writes only to DATA_DIR; SQLite may want scratch space under /tmp.
    read_only: ${READ_ONLY_ROOT:-true}
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # The minimum the entrypoint needs to hand a root-owned volume over and then
    # drop privileges. Everything else stays dropped, and the application itself
    # runs without any of these. Remove the block when CONTAINER_USER is an
    # unprivileged account.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-256m}
    cpus: ${CPU_LIMIT:-1.0}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8080') + '/healthz', timeout=2)
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    # Every request is logged to stdout, so cap the json-file driver or a
    # long-running host fills its disk.
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  budget_data:
    name: ${VOLUME_NAME:-budget_data}
